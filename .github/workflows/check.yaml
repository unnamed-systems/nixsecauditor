name: Check

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  flake-checks:
    name: Run flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Run flake checks
        run: nix flake check
